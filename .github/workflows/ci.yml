name: CI

# Pushes to main are covered by the Release workflow.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Version-independent checks only need to run once.
      - if: matrix.node == '22'
        run: npm run lint
      - if: matrix.node == '22'
        run: npm run format:check
      - if: matrix.node == '22'
        run: npm run build
